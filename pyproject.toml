[build-system]
requires = ["uv_build>=0.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project]
name = "eps-commons"
version = "0.1.0"
description = "Codi comú per als projectes Django de l'EPS"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
    "requests~=2.32.3",
    "requests-oauthlib~=2.0.0",
]

[project.optional-dependencies]
ldap = ["python-ldap>=3.4", "certifi"]
