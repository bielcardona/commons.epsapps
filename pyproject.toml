[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eps-commons"
version = "1.2.0"
description = "Codi comú per als projectes Django de l'EPS"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
    "requests~=2.32.3",
    "requests-oauthlib~=2.0.0",
]

[project.optional-dependencies]
ldap = ["python-ldap>=3.4", "certifi"]
